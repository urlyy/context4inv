[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "context4inv"
version = "0.1.0"
description = "Generate and verify C loop invariants with LLMs and Z3"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
context4inv = "context4inv:main"

[project.optional-dependencies]
local = ["torch>=2.5", "transformers>=4.45,<5", "accelerate>=1.0"]

[tool.ruff]
target-version = "py312"
exclude = [".validation", "dataset", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["context4inv"]

[tool.setuptools.packages.find]
include = ["nodes*", "utils*", "prompt_templates*"]
namespaces = true
